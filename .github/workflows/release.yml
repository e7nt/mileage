name: Release

# Pushing a tag like v0.2.0 builds that version and publishes it as a GitHub Release.
# The Site workflow then points latest.txt at it, which is what `mileage --upgrade` reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build release zip
        run: make release VERSION="$VERSION"

      # Guards against shipping a zip whose app reports a different version than the tag,
      # which would make every install look out of date and upgrade forever.
      - name: Check the built app
        run: |
          built="$(./Mileage.app/Contents/MacOS/Mileage --version)"
          [ "$built" = "$VERSION" ] || { echo "::error::app reports $built, tag is $VERSION"; exit 1; }
          lipo -archs Mileage.app/Contents/MacOS/Mileage
          ./Mileage.app/Contents/MacOS/Mileage --once

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "mileage $VERSION" --generate-notes
